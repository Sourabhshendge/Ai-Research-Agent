server:
  port: 8080

spring:
  application:
    name: ai-research-agent

  profiles:
    active: local

info:
  app:
    name: AI Research Agent
    version: 1.0.0
    description: Production RAG Platform

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus


  health:
    rabbit:
      enabled: false

  endpoint:
    health:
      show-details: always

  info:
    env:
      enabled: true